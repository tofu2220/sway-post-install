# Packages from the official EndeavourOS/Arch repositories.
[pacman]
micro
fcitx5
fcitx5-unikey
fcitx5-configtool
nwg-displays
mpv
xarchiver
zip
7zip
zed
github-cli
uv
zoxide
blueman
qbittorrent

# Packages built and installed through Yay.
[aur]
auto-cpufreq
github-desktop-bin
docker-desktop

# Installed packages to remove after all installations succeed.
[remove]
file-roller

# These are printed and saved after the automated stages succeed.
[reminders]
In Micro, run: set colorscheme simple
Add to ~/.bashrc: export EDITOR="micro"
Add to ~/.config/sway/config.d/autostart_applications: exec fcitx5
Run fcitx5-configtool and set Toggle Input Method to Alt + Left Shift
In fcitx5-configtool, disable Temporarily Toggle Input Method
In fcitx5-configtool, disable the Clipboard addon
Add to ~/.config/sway/config.d/output: include ~/.config/sway/outputs
Add to ~/.bashrc: eval "$(zoxide init bash)"
Apply the custom multiline PS1 from sway-eos.md
Run: sudo systemctl mask power-profiles-daemon.service
Run: sudo systemctl enable auto-cpufreq.service
Run: sudo systemctl enable bluetooth
In auto-cpufreq, turn Bluetooth on boot off
Add to ~/.config/sway/config.d/autostart_applications: exec blueman-applet
